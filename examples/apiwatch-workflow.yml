name: apiwatch
on:
  schedule:
    - cron: "17 6 * * *"   # daily; offset to avoid top-of-hour congestion
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  apiwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Anoghkandimalla/Vines@v0.2.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
