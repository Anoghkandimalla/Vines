# Drop this at the root of the repo you want watched.
apis:
  - name: stripe
    changelog: https://docs.stripe.com/changelog.md
  - name: twilio
    changelog: https://raw.githubusercontent.com/twilio/twilio-python/main/CHANGES.md
    # format: twilio   # defaults to the api name; set it when `name` differs
state_file: .apiwatch/state.json
base_branch: main
# Optional: verify each patch with your test suite before the PR opens.
# Runs on the CI runner with secrets removed from its environment.
# test_command: pip install -e ".[test]" && pytest -q
# test_timeout: 1200   # seconds
